<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.982 0.004 130);
    --fg: oklch(0.225 0.012 155);
    --muted: oklch(0.43 0.016 152);
    --border: oklch(0.905 0.01 145);
    --signal: oklch(0.53 0.115 152);
    --ink: oklch(0.4 0.095 152);
    --tint: oklch(0.952 0.024 152);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  .frame {
    width: 1200px; height: 630px;
    padding: 30px;
  }
  .card {
    width: 100%; height: 100%;
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 52px 60px 48px;
    display: flex; flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(720px 340px at 88% -12%, var(--tint), transparent 70%);
  }

  /* top row */
  .top { display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark-badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--tint); border: 1.5px solid color-mix(in oklab, var(--signal) 35%, transparent);
    display: flex; align-items: center; justify-content: center;
  }
  .mark-badge svg { display: block; }
  .mark-name { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
  .top-repo { font-size: 19px; color: var(--muted); }

  /* headline */
  .mid h1 {
    font-size: 88px; line-height: 1.02; font-weight: 700; letter-spacing: -0.03em;
    max-width: 15ch;
  }
  .mid h1 em { font-style: normal; color: var(--signal); }
  .mid p.sub {
    margin-top: 26px;
    font-size: 23px; color: var(--muted); letter-spacing: 0.01em;
  }
  .mid p.sub b { color: var(--ink); font-weight: 500; }

  /* bottom row: the loop + verdicts */
  .bottom { display: flex; align-items: flex-end; justify-content: space-between; }
  .loop { display: flex; align-items: center; gap: 10px; }
  .stage {
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 10px 15px;
    font-size: 17px; color: var(--fg); background: var(--bg);
    display: flex; align-items: baseline; gap: 9px;
    white-space: nowrap;
  }
  .stage .n { font-size: 12.5px; color: var(--muted); letter-spacing: 0.12em; }
  .stage.hot { border-color: color-mix(in oklab, var(--signal) 50%, transparent); background: var(--tint); }
  .stage.hot .n { color: var(--ink); }
  .link { width: 30px; height: 2px; background: var(--border); position: relative; flex-shrink: 0; }
  .link.active { background: color-mix(in oklab, var(--signal) 60%, transparent); }
  .link.active::after {
    content: ''; position: absolute; right: -1px; top: -3.5px;
    border-left: 7px solid var(--signal);
    border-top: 4.5px solid transparent; border-bottom: 4.5px solid transparent;
  }
  .loop-icon {
    width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0;
    border: 1.5px solid var(--border); background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .verdicts { display: flex; gap: 10px; }
  .chip {
    height: 38px; padding: 0 18px; border-radius: 999px;
    display: flex; align-items: center; font-size: 16.5px;
    border: 1.5px solid var(--border); background: var(--bg); color: var(--fg);
    white-space: nowrap;
  }
  .chip.green { background: var(--tint); border-color: transparent; color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <div class="top">
        <div class="mark">
          <div class="mark-badge">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.53 0.115 152)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
          </div>
          <div class="mark-name">do-harness</div>
        </div>
        <div class="top-repo mono">github.com/d-o-hub/do-harness</div>
      </div>

      <div class="mid">
        <h1>Agents that <em>prove</em> their work.</h1>
        <p class="sub mono">feedforward <b>guides in</b> &middot; feedback <b>verdicts out</b> &middot; exit 0 or it is not done</p>
      </div>

      <div class="bottom">
        <div class="loop mono">
          <div class="stage"><span class="n">01</span>guides</div>
          <div class="link active"></div>
          <div class="stage"><span class="n">02</span>agent</div>
          <div class="link"></div>
          <div class="stage hot"><span class="n">03</span>sensors</div>
          <div class="link"></div>
          <div class="stage"><span class="n">04</span>state</div>
          <div class="loop-icon">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="oklch(0.53 0.115 152)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>
            </svg>
          </div>
        </div>
        <div class="verdicts mono">
          <div class="chip green">exit 0 &middot; GREEN</div>
          <div class="chip">exit 1 &middot; RED</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
