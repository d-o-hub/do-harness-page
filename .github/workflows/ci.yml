name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, build pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint workflows (actionlint, pinned)
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color
          rm -f actionlint

      - name: Lint (zero warnings)
        run: bun run lint

      - name: Typecheck (zero errors, whole repo)
        run: bunx tsc --noEmit

      - name: Static export (runs its own TypeScript check)
        run: bun run build:pages

      - name: Smoke-test the exported artifact
        run: bun test
