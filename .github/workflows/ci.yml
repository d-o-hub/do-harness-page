name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, build pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (zero warnings)
        run: bun run lint

      - name: Typecheck (zero errors, whole repo)
        run: bunx tsc --noEmit

      - name: Static export (runs its own TypeScript check)
        run: bun run build:pages
